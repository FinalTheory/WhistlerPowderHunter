server {
    listen 80;
    listen [::]:80;
    server_name whistler.finaltheory.me;

    location ^~ /.well-known/acme-challenge/ {
        root /var/lib/whistler-acme;
        try_files $uri =404;
    }

    location / {
        return 301 https://whistler.finaltheory.me$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name whistler.finaltheory.me;

    ssl_certificate /etc/letsencrypt/live/whistler.finaltheory.me/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/whistler.finaltheory.me/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;

    root /var/lib/whistler/public;
    disable_symlinks on from=$document_root;

    location = / {
        add_header Cache-Control "no-cache";
        try_files /index.html =503;
    }

    location = /index.html {
        add_header Cache-Control "no-cache";
        try_files $uri =503;
    }

    location ~ "^/data/[a-zA-Z0-9_.-]+/[0-9]{10}/[a-zA-Z0-9_.-]+/[0-9]{10}([0-9]{2})?\.(png|jpg|jpeg)$" {
        add_header X-Content-Type-Options nosniff;
        try_files $uri =404;
    }

    location / {
        return 404;
    }
}
